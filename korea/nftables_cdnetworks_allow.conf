# nftables allow rules for cdnetworks

table inet filter_cdnetworks_allow {
  chain input {
    type filter hook input priority 0; policy drop;
    ip saddr 14.0.32.0/19 accept
    ip saddr 14.0.64.0/18 accept
    ip saddr 61.110.192.0/18 accept
    ip saddr 101.79.144.0/20 accept
    ip saddr 101.79.160.0/20 accept
    ip saddr 101.79.208.0/20 accept
    ip saddr 101.79.224.0/20 accept
    ip saddr 103.248.104.0/22 accept
    ip saddr 114.111.48.0/20 accept
    ip saddr 116.193.80.0/20 accept
    ip saddr 118.107.160.0/20 accept
    ip saddr 119.31.248.0/21 accept
    ip saddr 175.41.0.0/20 accept
    ip saddr 211.43.144.0/20 accept
    ip6 saddr 2401:c500::/32 accept
  }
}
