# nftables deny rules for gdsys

table inet filter_gdsys_deny {
  chain input {
    type filter hook input priority 0; policy accept;
    ip saddr 103.240.48.0/22 drop
    ip saddr 180.131.0.0/18 drop
    ip saddr 183.86.192.0/18 drop
    ip saddr 202.90.252.0/22 drop
  }
}
