# nftables deny rules for dotname

table inet filter_dotname_deny {
  chain input {
    type filter hook input priority 0; policy accept;
    ip saddr 45.120.64.0/22 drop
    ip saddr 103.31.180.0/22 drop
    ip saddr 121.0.64.0/18 drop
    ip saddr 203.210.16.0/20 drop
    ip saddr 210.87.192.0/19 drop
  }
}
