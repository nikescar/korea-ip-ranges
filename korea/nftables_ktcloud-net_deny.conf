# nftables deny rules for ktcloud-net

table inet filter_ktcloud-net_deny {
  chain input {
    type filter hook input priority 0; policy accept;
    ip saddr 163.223.94.0/23 drop
    ip6 saddr 2401:f560::/32 drop
  }
}
