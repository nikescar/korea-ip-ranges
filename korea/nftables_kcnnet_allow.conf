# nftables allow rules for kcnnet

table inet filter_kcnnet_allow {
  chain input {
    type filter hook input priority 0; policy drop;
    ip saddr 61.110.128.0/22 accept
    ip saddr 61.110.160.0/19 accept
    ip saddr 103.20.116.0/22 accept
    ip saddr 122.0.32.0/19 accept
    ip saddr 124.46.128.0/17 accept
    ip saddr 182.237.192.0/18 accept
    ip6 saddr 2403:6300::/32 accept
  }
}
