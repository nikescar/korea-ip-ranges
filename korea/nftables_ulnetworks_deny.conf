# nftables deny rules for ulnetworks

table inet filter_ulnetworks_deny {
  chain input {
    type filter hook input priority 0; policy accept;
    ip saddr 27.125.0.0/17 drop
    ip saddr 61.100.240.0/21 drop
    ip saddr 113.197.80.0/20 drop
    ip saddr 182.237.64.0/18 drop
    ip saddr 211.235.192.0/19 drop
    ip6 saddr 2405:4300::/32 drop
  }
}
