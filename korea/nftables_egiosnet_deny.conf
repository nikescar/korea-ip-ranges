# nftables deny rules for egiosnet

table inet filter_egiosnet_deny {
  chain input {
    type filter hook input priority 0; policy accept;
    ip saddr 103.231.128.0/22 drop
    ip saddr 211.47.160.0/22 drop
    ip6 saddr 2405:c000::/32 drop
  }
}
