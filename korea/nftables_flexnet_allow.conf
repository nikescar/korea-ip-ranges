# nftables allow rules for flexnet

table inet filter_flexnet_allow {
  chain input {
    type filter hook input priority 0; policy drop;
    ip saddr 14.192.80.0/20 accept
    ip saddr 43.255.252.0/22 accept
    ip saddr 103.239.240.0/22 accept
    ip saddr 111.67.208.0/20 accept
    ip saddr 115.165.176.0/21 accept
    ip saddr 175.111.16.0/20 accept
  }
}
