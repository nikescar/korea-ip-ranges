# nftables deny rules for ktnet

table inet filter_ktnet_deny {
  chain input {
    type filter hook input priority 0; policy accept;
    ip saddr 120.143.192.0/18 drop
    ip saddr 203.233.192.0/19 drop
    ip saddr 203.233.224.0/20 drop
    ip saddr 203.242.128.0/17 drop
    ip saddr 210.102.64.0/19 drop
    ip saddr 210.111.192.0/19 drop
    ip saddr 210.181.192.0/19 drop
    ip saddr 210.205.64.0/19 drop
    ip saddr 210.217.128.0/19 drop
    ip saddr 211.37.192.0/19 drop
    ip6 saddr 2001:eb8::/32 drop
  }
}
