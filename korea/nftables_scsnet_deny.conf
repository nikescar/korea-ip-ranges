# nftables deny rules for scsnet

table inet filter_scsnet_deny {
  chain input {
    type filter hook input priority 0; policy accept;
    ip saddr 58.65.64.0/18 drop
    ip saddr 103.117.0.0/22 drop
    ip saddr 115.160.0.0/17 drop
    ip saddr 121.1.64.0/18 drop
    ip saddr 124.153.128.0/17 drop
    ip saddr 182.31.0.0/16 drop
    ip saddr 211.246.128.0/17 drop
  }
}
