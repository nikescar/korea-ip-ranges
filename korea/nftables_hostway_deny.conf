# nftables deny rules for hostway

table inet filter_hostway_deny {
  chain input {
    type filter hook input priority 0; policy accept;
    ip saddr 103.24.8.0/22 drop
    ip saddr 150.107.68.0/22 drop
    ip6 saddr 2406:ad00::/32 drop
  }
}
