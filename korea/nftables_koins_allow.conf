# nftables allow rules for koins

table inet filter_koins_allow {
  chain input {
    type filter hook input priority 0; policy drop;
    ip saddr 103.244.108.0/22 accept
    ip saddr 114.31.112.0/20 accept
    ip saddr 211.255.192.0/20 accept
  }
}
