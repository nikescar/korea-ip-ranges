# nftables allow rules for dek-net

table inet filter_dek-net_allow {
  chain input {
    type filter hook input priority 0; policy drop;
    ip saddr 103.126.234.0/23 accept
    ip6 saddr 2400:fd60::/32 accept
  }
}
