# nftables deny rules for gcs

table inet filter_gcs_deny {
  chain input {
    type filter hook input priority 0; policy accept;
    ip saddr 27.113.0.0/17 drop
    ip saddr 114.199.0.0/18 drop
    ip saddr 119.17.0.0/19 drop
    ip saddr 121.55.64.0/18 drop
    ip saddr 121.55.128.0/18 drop
    ip saddr 125.208.192.0/18 drop
    ip6 saddr 2407:2000::/32 drop
  }
}
