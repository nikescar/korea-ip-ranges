# nftables allow rules for gdsys

table inet filter_gdsys_allow {
  chain input {
    type filter hook input priority 0; policy drop;
    ip saddr 103.240.48.0/22 accept
    ip saddr 180.131.0.0/18 accept
    ip saddr 183.86.192.0/18 accept
    ip saddr 202.90.252.0/22 accept
  }
}
