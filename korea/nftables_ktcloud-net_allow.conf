# nftables allow rules for ktcloud-net

table inet filter_ktcloud-net_allow {
  chain input {
    type filter hook input priority 0; policy drop;
    ip saddr 163.223.94.0/23 accept
    ip6 saddr 2401:f560::/32 accept
  }
}
