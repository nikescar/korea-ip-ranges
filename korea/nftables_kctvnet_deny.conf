# nftables deny rules for kctvnet

table inet filter_kctvnet_deny {
  chain input {
    type filter hook input priority 0; policy accept;
    ip saddr 43.227.120.0/22 drop
    ip saddr 61.245.176.0/20 drop
    ip saddr 103.226.76.0/22 drop
    ip saddr 111.91.144.0/20 drop
    ip saddr 111.91.160.0/19 drop
    ip saddr 119.77.96.0/19 drop
    ip saddr 123.100.160.0/19 drop
  }
}
