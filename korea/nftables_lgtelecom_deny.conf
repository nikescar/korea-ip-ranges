# nftables deny rules for lgtelecom

table inet filter_lgtelecom_deny {
  chain input {
    type filter hook input priority 0; policy accept;
    ip saddr 106.96.0.0/13 drop
    ip saddr 180.210.192.0/21 drop
    ip saddr 203.82.240.0/21 drop
    ip saddr 223.168.0.0/13 drop
    ip6 saddr 2001:4430::/32 drop
  }
}
