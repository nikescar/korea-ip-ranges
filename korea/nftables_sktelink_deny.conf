# nftables deny rules for sktelink

table inet filter_sktelink_deny {
  chain input {
    type filter hook input priority 0; policy accept;
    ip saddr 210.93.192.0/19 drop
    ip saddr 210.111.128.0/19 drop
    ip saddr 210.115.96.0/19 drop
    ip saddr 210.219.64.0/18 drop
    ip saddr 211.39.0.0/18 drop
    ip saddr 211.43.224.0/19 drop
    ip saddr 211.173.192.0/18 drop
    ip saddr 211.237.64.0/23 drop
    ip saddr 211.237.66.0/24 drop
    ip saddr 211.237.72.0/24 drop
    ip saddr 211.237.76.0/23 drop
    ip saddr 211.237.79.0/24 drop
    ip6 saddr 2001:e98::/32 drop
  }
}
