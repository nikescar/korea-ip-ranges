# nftables deny rules for dek-net

table inet filter_dek-net_deny {
  chain input {
    type filter hook input priority 0; policy accept;
    ip saddr 103.126.234.0/23 drop
    ip6 saddr 2400:fd60::/32 drop
  }
}
