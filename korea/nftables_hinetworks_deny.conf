# nftables deny rules for hinetworks

table inet filter_hinetworks_deny {
  chain input {
    type filter hook input priority 0; policy accept;
    ip saddr 211.47.128.0/22 drop
    ip saddr 211.116.224.0/19 drop
    ip saddr 211.189.128.0/19 drop
    ip saddr 211.237.128.0/20 drop
    ip saddr 211.241.128.0/17 drop
    ip saddr 211.254.0.0/17 drop
    ip saddr 218.36.0.0/17 drop
    ip6 saddr 2407:b200::/32 drop
  }
}
