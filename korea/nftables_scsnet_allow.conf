    type filter hook input priority 0; policy drop;
    ip saddr 58.65.64.0/18 accept
    ip saddr 103.117.0.0/22 accept
    ip saddr 115.160.0.0/17 accept
    ip saddr 121.1.64.0/18 accept
    ip saddr 124.153.128.0/17 accept
    ip saddr 182.31.0.0/16 accept
    ip saddr 211.246.128.0/17 accept
  }
}
