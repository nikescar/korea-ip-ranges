# nftables deny rules for direct-hosting

table inet filter_direct-hosting_deny {
  chain input {
    type filter hook input priority 0; policy accept;
    ip saddr 58.84.44.0/22 drop
    ip saddr 103.4.148.0/22 drop
    ip saddr 223.130.64.0/18 drop
    ip6 saddr 2403:3700::/32 drop
  }
}
