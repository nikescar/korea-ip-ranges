# nftables deny rules for lg-net

table inet filter_lg-net_deny {
  chain input {
    type filter hook input priority 0; policy accept;
    ip saddr 27.122.128.0/17 drop
    ip saddr 121.50.16.0/20 drop
    ip saddr 124.46.0.0/17 drop
    ip saddr 150.150.0.0/16 drop
    ip saddr 156.147.0.0/16 drop
    ip saddr 165.186.0.0/16 drop
    ip saddr 165.243.0.0/16 drop
    ip saddr 165.244.0.0/16 drop
    ip saddr 202.21.0.0/21 drop
    ip saddr 203.247.128.0/19 drop
    ip6 saddr 2400:3300::/32 drop
  }
}
