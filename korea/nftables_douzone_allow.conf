# nftables allow rules for douzone

table inet filter_douzone_allow {
  chain input {
    type filter hook input priority 0; policy drop;
    ip saddr 45.64.140.0/22 accept
    ip saddr 103.8.100.0/22 accept
    ip saddr 202.167.215.0/24 accept
    ip saddr 221.133.55.0/24 accept
  }
}
