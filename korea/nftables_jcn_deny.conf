# nftables deny rules for jcn

table inet filter_jcn_deny {
  chain input {
    type filter hook input priority 0; policy accept;
    ip saddr 103.11.248.0/22 drop
    ip saddr 103.68.96.0/22 drop
    ip saddr 112.109.32.0/19 drop
    ip saddr 113.192.64.0/18 drop
    ip saddr 116.212.0.0/19 drop
    ip saddr 124.216.0.0/16 drop
    ip saddr 180.211.0.0/18 drop
    ip saddr 182.161.128.0/17 drop
    ip6 saddr 2402:1a00::/32 drop
  }
}
