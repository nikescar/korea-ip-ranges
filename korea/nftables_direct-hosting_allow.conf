# nftables allow rules for direct-hosting

table inet filter_direct-hosting_allow {
  chain input {
    type filter hook input priority 0; policy drop;
    ip saddr 58.84.44.0/22 accept
    ip saddr 103.4.148.0/22 accept
    ip saddr 223.130.64.0/18 accept
    ip6 saddr 2403:3700::/32 accept
  }
}
