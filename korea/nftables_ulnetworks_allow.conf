# nftables allow rules for ulnetworks

table inet filter_ulnetworks_allow {
  chain input {
    type filter hook input priority 0; policy drop;
    ip saddr 27.125.0.0/17 accept
    ip saddr 61.100.240.0/21 accept
    ip saddr 113.197.80.0/20 accept
    ip saddr 182.237.64.0/18 accept
    ip saddr 211.235.192.0/19 accept
    ip6 saddr 2405:4300::/32 accept
  }
}
