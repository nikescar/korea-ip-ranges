# nftables allow rules for egiosnet

table inet filter_egiosnet_allow {
  chain input {
    type filter hook input priority 0; policy drop;
    ip saddr 103.231.128.0/22 accept
    ip saddr 211.47.160.0/22 accept
    ip6 saddr 2405:c000::/32 accept
  }
}
