# nftables deny rules for koins

table inet filter_koins_deny {
  chain input {
    type filter hook input priority 0; policy accept;
    ip saddr 103.244.108.0/22 drop
    ip saddr 114.31.112.0/20 drop
    ip saddr 211.255.192.0/20 drop
  }
}
