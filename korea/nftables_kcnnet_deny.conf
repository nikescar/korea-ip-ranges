# nftables deny rules for kcnnet

table inet filter_kcnnet_deny {
  chain input {
    type filter hook input priority 0; policy accept;
    ip saddr 61.110.128.0/22 drop
    ip saddr 61.110.160.0/19 drop
    ip saddr 103.20.116.0/22 drop
    ip saddr 122.0.32.0/19 drop
    ip saddr 124.46.128.0/17 drop
    ip saddr 182.237.192.0/18 drop
    ip6 saddr 2403:6300::/32 drop
  }
}
