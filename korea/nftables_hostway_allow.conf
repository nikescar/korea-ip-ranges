# nftables allow rules for hostway

table inet filter_hostway_allow {
  chain input {
    type filter hook input priority 0; policy drop;
    ip saddr 103.24.8.0/22 accept
    ip saddr 150.107.68.0/22 accept
    ip6 saddr 2406:ad00::/32 accept
  }
}
