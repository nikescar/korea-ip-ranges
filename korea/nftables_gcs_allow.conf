# nftables allow rules for gcs

table inet filter_gcs_allow {
  chain input {
    type filter hook input priority 0; policy drop;
    ip saddr 27.113.0.0/17 accept
    ip saddr 114.199.0.0/18 accept
    ip saddr 119.17.0.0/19 accept
    ip saddr 121.55.64.0/18 accept
    ip saddr 121.55.128.0/18 accept
    ip saddr 125.208.192.0/18 accept
    ip6 saddr 2407:2000::/32 accept
  }
}
