# nftables allow rules for ktnet

table inet filter_ktnet_allow {
  chain input {
    type filter hook input priority 0; policy drop;
    ip saddr 120.143.192.0/18 accept
    ip saddr 203.233.192.0/19 accept
    ip saddr 203.233.224.0/20 accept
    ip saddr 203.242.128.0/17 accept
    ip saddr 210.102.64.0/19 accept
    ip saddr 210.111.192.0/19 accept
    ip saddr 210.181.192.0/19 accept
    ip saddr 210.205.64.0/19 accept
    ip saddr 210.217.128.0/19 accept
    ip saddr 211.37.192.0/19 accept
    ip6 saddr 2001:eb8::/32 accept
  }
}
