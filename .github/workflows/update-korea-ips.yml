name: Update Korea IP Ranges

on:
  schedule:
    # Run monthly on 1st day at 02:00 UTC
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install netaddr

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install html-table-csv-converter
        run: cargo install --git https://github.com/nikescar/html-table-csv-converter.git

      - name: Download IP data
        run: bash .github/scripts/download.sh
        env:
          TEMP_DIR: /tmp/korea-ip-ranges

      - name: Convert to CIDR
        run: bash .github/scripts/convert.sh
        env:
          TEMP_DIR: /tmp/korea-ip-ranges

      - name: Merge CIDRs
        run: bash .github/scripts/merge.sh
        env:
          TEMP_DIR: /tmp/korea-ip-ranges

      - name: Generate formats
        run: bash .github/scripts/generate-formats.sh
        env:
          TEMP_DIR: /tmp/korea-ip-ranges
          OUTPUT_DIR: .

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected in IP ranges"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected, will commit"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Korea IP ranges"
          git push
